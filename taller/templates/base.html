<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BiblioHub | Gestión de Biblioteca{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 1.4rem;
            font-weight: bold;
            color: #111827;
        }

        .brand-icon {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #2563eb;
            color: white;

            border-radius: 10px;

            font-size: 1.3rem;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #4b5563;
            text-decoration: none;
            font-size: 0.95rem;

            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #2563eb;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: calc(100vh - 72px);

            display: flex;
            align-items: center;

            padding: 60px 7%;

            background:
                radial-gradient(
                    circle at 80% 20%,
                    #dbeafe 0,
                    transparent 30%
                ),
                #f5f7fa;
        }

        .hero-container {
            width: 100%;
            max-width: 1150px;

            margin: auto;

            display: grid;
            grid-template-columns: 1.1fr 0.9fr;

            gap: 80px;

            align-items: center;
        }


        /* =========================
           TEXTO
        ========================= */

        .badge {
            display: inline-block;

            background: #dbeafe;
            color: #1d4ed8;

            padding: 7px 14px;

            border-radius: 20px;

            font-size: 0.8rem;
            font-weight: bold;

            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 4rem;
            line-height: 1.1;

            margin-bottom: 20px;

            color: #111827;
        }

        .hero h1 span {
            color: #2563eb;
        }

        .hero h2 {
            font-size: 1.5rem;
            font-weight: normal;

            color: #4b5563;

            margin-bottom: 20px;
        }

        .hero-description {
            max-width: 600px;

            color: #6b7280;

            line-height: 1.7;

            font-size: 1.05rem;

            margin-bottom: 30px;
        }


        /* =========================
           BOTONES
        ========================= */

        .buttons {
            display: flex;
            gap: 15px;

            flex-wrap: wrap;
        }

        .btn {
            padding: 13px 22px;

            border-radius: 8px;

            text-decoration: none;

            font-weight: bold;

            transition: all 0.2s;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: white;
            color: #374151;

            border: 1px solid #d1d5db;
        }

        .btn-secondary:hover {
            border-color: #2563eb;
            color: #2563eb;
        }


        /* =========================
           ILUSTRACIÓN
        ========================= */

        .illustration {
            display: flex;
            justify-content: center;
        }

        .book-card {
            width: 350px;
            height: 350px;

            background: white;

            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.08);

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .books {
            font-size: 8rem;
        }

        .floating-card {
            position: absolute;

            background: white;

            padding: 14px 18px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);

            font-size: 0.85rem;

            font-weight: bold;
        }

        .card-users {
            top: 35px;
            right: -30px;
        }

        .card-books {
            bottom: 35px;
            left: -30px;
        }


        /* =========================
           CARACTERÍSTICAS
        ========================= */

        .features {
            display: flex;

            gap: 20px;

            margin-top: 40px;
        }

        .feature {
            display: flex;

            align-items: center;

            gap: 10px;

            color: #6b7280;

            font-size: 0.9rem;
        }

        .feature-icon {
            font-size: 1.3rem;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .hero-container {
                grid-template-columns: 1fr;

                text-align: center;

                gap: 50px;
            }

            .hero-description {
                margin-left: auto;
                margin-right: auto;
            }

            .buttons {
                justify-content: center;
            }

            .features {
                justify-content: center;
                flex-wrap: wrap;
            }

            .illustration {
                display: none;
            }

            .hero h1 {
                font-size: 3rem;
            }
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 0 5%;
            }

            .nav-links {
                display: none;
            }

            .hero {
                padding: 50px 5%;
            }

            .hero h1 {
                font-size: 2.5rem;
            }

            .hero h2 {
                font-size: 1.2rem;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">

        <div class="brand">

            <div class="brand-icon">
                📚
            </div>

            <span>BiblioHub</span>

        </div>


        <nav class="nav-links">

            <a href="#">Inicio</a>
            <a href="#">Catálogo</a>
            <a href="#">Usuarios</a>
            <a href="#">Préstamos</a>

        </nav>

    </header>


    <!-- =========================
         HERO
    ========================= -->

    <main class="hero">

        <div class="hero-container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

</body>
</html>
